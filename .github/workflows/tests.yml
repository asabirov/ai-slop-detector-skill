name: self-lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # ubuntu, not macos: a private repo bills macOS minutes at ten times the
    # rate. Move this only if the tests genuinely need a Mac.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: The detector passes its own rules
        run: npm run lint:self
