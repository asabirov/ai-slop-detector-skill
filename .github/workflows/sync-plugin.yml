name: sync skill into the plugin

# The rules and their documentation live here. This copies them into
# apliteni/claude-apliteni-plugin, where a Claude Code session reads them, and
# opens a pull request there. Mirrors lessly-hub/lessly-voice's sync-voice.yml.

on:
  push:
    branches: [main]
    paths:
      - SKILL.md
      - plugin-stub.md
      - tools/**
      - bin/**
      - scripts/**
      - fixtures/**
      - package.json
      - docs/ai-slop-detector.md
      - .github/workflows/sync-plugin.yml
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: sync-plugin
  cancel-in-progress: true

env:
  PLUGIN_REPO: apliteni/claude-apliteni-plugin
  SKILL_DIR: skills/ai-slop-detector
  # Which page ships as the plugin's SKILL.md, and whether the linter ships beside
  # it. `skill` is today: the real page, plus bin/, scripts/, fixtures/ and
  # package.json. `stub` is the install pointer alone, for the day
  # apliteni/claude-apliteni-plugin#82 stops shipping the source. That day is one
  # word here — both halves move together, so the plugin cannot end up with a stub
  # and the code, or the skill page and no code.
  SKILL_PAGE: skill

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the detector (source of truth)
        uses: actions/checkout@v4
        with:
          path: detector

      # A GitHub App, not a personal token: it does not expire, it is not tied to
      # one person's account, and its write reaches exactly one repository. Same
      # pattern as design-system-to-skill-sync.yml in apliteni/design-system.
      #
      # PLUGIN_SYNC_APP_ID / _PRIVATE_KEY currently hold the
      # `apliteni-ds-to-plugin-sync` App, borrowed because it already has write on
      # the plugin. That is why sync pull requests are authored by a bot named for
      # the design system. Giving this sync its own App is a change of these two
      # values and nothing else.
      - name: Mint plugin-write token
        id: app
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547  # v1.12.0
        with:
          app-id: ${{ vars.PLUGIN_SYNC_APP_ID }}
          private-key: ${{ secrets.PLUGIN_SYNC_APP_PRIVATE_KEY }}
          owner: apliteni
          repositories: claude-apliteni-plugin

      - name: Check out the plugin (sync target)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PLUGIN_REPO }}
          token: ${{ steps.app.outputs.token }}
          path: plugin

      - name: Copy the skill and the reference into the plugin
        run: |
          set -euo pipefail
          dest="plugin/${SKILL_DIR}"
          rm -rf "$dest"
          mkdir -p "$dest"
          if [ "$SKILL_PAGE" = skill ]; then
            cp -R detector/bin detector/scripts detector/fixtures "$dest/"
            cp detector/package.json "$dest/package.json"
          fi
          node detector/tools/render-skill.js detector plugin \
            asabirov/ai-slop-detector-skill "$GITHUB_SHA" "$SKILL_PAGE"
          echo "shipped $SKILL_PAGE:"
          find "$dest" -maxdepth 1 -mindepth 1 -printf '%f\n' | sort

      - name: Open a PR on the plugin if the skill changed
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ steps.app.outputs.token }}
          path: plugin
          branch: sync/ai-slop-detector
          base: main
          commit-message: "fix(ai-slop-detector): sync the skill from asabirov/ai-slop-detector-skill"
          title: "fix(ai-slop-detector): sync the skill from source"
          body: |
            Regenerated `${{ env.SKILL_DIR }}` and `docs/ai-slop-detector.md` from
            `asabirov/ai-slop-detector-skill`.

            Source commit: ${{ github.sha }}

            This PR is generated. Do not hand-edit the skill in this repo; edit it in
            `asabirov/ai-slop-detector-skill` instead.
          labels: skill-sync
          delete-branch: true
