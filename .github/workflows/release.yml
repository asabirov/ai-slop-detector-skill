name: release

# A merge to main tags a version and writes release notes when the commits ask
# for one. It publishes nothing: the package is private and consumers install
# straight from this repository, so the tag is what they pin to.
#
# Nothing here pushes to main. `main` is protected and requires a pull request,
# so @semantic-release/git was rejected on every run this workflow ever made and
# no tag was ever cut. @semantic-release/github creates the tag and the release
# through the API, which protection does not sit in front of. The cost is that
# the changelog and the package.json version live on the release page instead of
# in a committed file.

on:
  push:
    branches: [main]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install semantic-release
        run: |
          npm install --no-save \
            semantic-release@24 \
            @semantic-release/github@11
      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
