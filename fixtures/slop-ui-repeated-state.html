<!doctype html>
<!-- FIXTURE: the Finance report period screen from issue #39 — a title that
     repeats the selected period, the comparison baseline said twice, a sentence
     built around a live count, and tooltip text printed as a line. Four rules
     depend on this file; do not "clean" it. -->
<html lang="en">
<head><meta charset="utf-8"><title>Finance report</title></head>
<body>
  <div role="group" aria-label="Period">
    <button>Jul</button><button>Aug</button><button aria-pressed="true">Sep</button>
  </div>
  <h2>September 2026</h2>                                   <!-- state-title-echo -->
  <p>Compared with August 2026</p>                          <!-- tooltip-as-text -->

  <p>Change against August 2026</p>                         <!-- restated-fact -->
  <table>
    <caption>Ledger</caption>
    <tbody><tr><td>Software</td><td>1,204.50</td></tr></tbody>
  </table>
  <p class="ledger-note">The changes are against August 2026</p>

  <p>4 rows would move to Software. Each amount shows how much the move adds to
     or removes from Software.</p>                           <!-- count-sentence -->
</body>
</html>
