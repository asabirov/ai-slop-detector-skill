<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Requests</title><style>
:root { --paper: #f4efe3; --surface: #fffdf7; --ink: #1d2a2a; --owner: #6a4d10; --owner-bg: #f2e7cf; --warn: #875000; --ok: #2c6639; --sans: "Avenir Next", system-ui, sans-serif; }
html { background: var(--paper); }
body { color: var(--ink); font: 400 16px/1.5 var(--sans); }
.list { background: var(--surface); }
.waiting { color: var(--owner); background: var(--owner-bg); }
.merged { color: var(--ok); }
</style></head>
<body><ul class="list"><li class="waiting">Waiting on owner</li><li class="merged">Merged</li></ul></body></html>
